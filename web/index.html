<head>
<meta charset="utf-8">

<title>Senko Hanabi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 0v9%22 stroke=%22%23c9a27a%22/%3E%3Ccircle cx=%228%22 cy=%2210.5%22 r=%222.2%22 fill=%22%23ffb347%22/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage { position: absolute; left: 50%; top: 50%; overflow: hidden; }
  #c { display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: #f3ebdf; font: 400 13px/1.4 'Noto Sans JP', system-ui, sans-serif; }
  .cap { position: absolute; left: 6.2%; bottom: 9%; opacity: 0; }
  .cap b { display: block; font: 500 54px/1 'Shippori Mincho', serif; letter-spacing: .14em; text-shadow: 0 0 24px rgba(0,0,0,.6); }
  .cap i { display: block; margin-top: 14px; font-style: normal; font-size: 18px; letter-spacing: .32em; text-transform: uppercase; color: rgba(243,235,223,.62); }
  .note { position: absolute; right: 6.2%; bottom: 9%; opacity: 0; font-size: 18px; letter-spacing: .32em; text-transform: uppercase; color: rgba(243,235,223,.7); }
  .title { position: absolute; left: 28px; top: 24px; }
  .title b { display: block; font: 500 22px/1 'Shippori Mincho', serif; letter-spacing: .2em; }
  .title i { display: block; margin-top: 8px; font-style: normal; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: rgba(243,235,223,.5); }
  .msg { position: absolute; left: 50%; top: 72%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .6s; white-space: nowrap; }
  .msg.on { opacity: 1; }
  .msg b { display: block; font: 500 26px/1.2 'Shippori Mincho', serif; letter-spacing: .12em; }
  .msg i { display: block; margin-top: 10px; font-style: normal; font-size: 14px; letter-spacing: .08em; color: rgba(243,235,223,.7); }
  .msg button, .ctl button { pointer-events: auto; font: 500 13px/1 'Noto Sans JP', sans-serif; letter-spacing: .1em; color: #f3ebdf; background: rgba(255,255,255,.04); border: 1px solid rgba(243,235,223,.3); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
  .msg button { margin-top: 18px; }
  .msg button:hover, .ctl button:hover, .ctl button.on { background: rgba(255,200,140,.14); border-color: rgba(255,210,160,.6); }
  .hint { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); font-size: 12px; letter-spacing: .06em; color: rgba(243,235,223,.5); transition: opacity .6s; text-align: center; width: 90%; }
  .ctl { position: absolute; right: 24px; top: 22px; display: flex; gap: 8px; }
  .timer { position: absolute; right: 28px; bottom: 26px; font: 500 14px/1 'Noto Sans JP', sans-serif; letter-spacing: .1em; color: rgba(243,235,223,.6); font-variant-numeric: tabular-nums; }
  @media (max-width: 700px) {
    .cap { left: 20px; bottom: 74px; } .cap b { font-size: 38px; } .cap i { font-size: 12px; margin-top: 10px; }
    .title { left: 18px; top: 18px; } .ctl { right: 14px; top: 14px; flex-direction: column; align-items: flex-end; }
    .msg b { font-size: 21px; } .timer { right: 18px; bottom: 80px; }
  }
</style>
